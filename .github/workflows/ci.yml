name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-14
          - windows-2022
        python-version:
          - "3.11"
          - "3.12"
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python sources
        run: python -m compileall -q scripts tests
      - name: Run full test suite
        run: python -m unittest discover -s tests -v
      - name: Check fetch CLI help
        run: python scripts/fetch_stock.py --help
      - name: Check search CLI help
        run: python scripts/search_stock.py --help

  validate-skill:
    name: Validate skill package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check --no-input PyYAML==6.0.2
      - name: Validate skill
        run: python .github/scripts/quick_validate.py .
